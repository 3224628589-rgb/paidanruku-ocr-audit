<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>拍单识别｜原图与日志对照工作台</title>
  <link rel="stylesheet" href="styles.css?v=20261110-field-review2">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">▦</span><span>拍单识别 <b>逐图工作台</b></span><small>当前未删除图片 · 2026-11-06 快照</small></div>
    <div id="globalStatus" class="global-status">正在读取目录…</div>
    <a class="legacy-link" href="legacy.html">旧版 167 张 ↗</a>
  </header>
  <div class="filters" role="search">
    <label>门店<select id="storeFilter"><option value="">全部门店</option></select></label>
    <label>供应商<select id="supplierFilter"><option value="">全部供应商</option></select></label>
    <label class="product-search">商品名称 / 图片 ID<input id="productFilter" type="search" placeholder="输入商品名称或图片 ID" autocomplete="off"></label>
    <button id="clearFilters" type="button" class="subtle">清空</button>
    <span id="filterCount" class="filter-count"></span>
  </div>
  <main class="workbench">
    <aside class="photo-rail" aria-label="图片目录">
      <div class="rail-head"><strong>图片列表</strong><span id="railCount"></span></div>
      <div id="photoList" class="photo-list"></div>
    </aside>
    <section class="image-pane" aria-label="原图及火山 OCR 坐标">
      <div class="pane-head image-head">
        <div><div id="photoTitle" class="photo-title">请选择图片</div><div id="photoMeta" class="photo-meta"></div></div>
        <div class="image-tools">
          <label class="overlay-toggle"><input id="overlayToggle" type="checkbox" checked>OCR 坐标框</label>
          <button id="rotateButton" type="button" title="旋转 90°">旋转</button>
          <button id="resetButton" type="button" title="恢复显示">重置</button>
        </div>
      </div>
      <div id="imageViewport" class="image-viewport">
        <div id="imageStage" class="image-stage">
          <img id="photoImage" alt="当前随货单原图">
          <svg id="ocrOverlay" aria-label="火山 OCR 四点坐标叠框"></svg>
        </div>
      </div>
      <div class="image-footer"><span id="selectedRegion">点击蓝色坐标框，可定位对应 OCR 文字</span><div class="zoom-control"><span>缩放</span><input id="zoomRange" type="range" min="50" max="220" value="100"><output id="zoomValue">100%</output></div></div>
    </section>
    <section class="results-pane" aria-label="四路识别对照">
      <div class="results-bar"><div id="sourceBadges"></div><div class="photo-nav"><button id="prevPhoto" type="button" aria-label="上一张">←</button><button id="nextPhoto" type="button" aria-label="下一张">→</button></div></div>
      <div class="results-scroll">
        <section class="result-section audit-section"><div class="section-title"><h2>这张图的结论</h2></div><div id="auditNote" class="audit-note"></div></section>
        <section class="result-section" id="doubaoSection"><div class="section-title"><h2>豆包识别内容</h2><select id="callSelect" aria-label="选择历史调用"></select></div><div id="doubaoContent"></div></section>
        <section class="result-section" id="finalSection"><div class="section-title"><h2>最终入库行</h2><span id="finalCount"></span></div><div id="finalContent"></div></section>
        <section class="result-section codex-section" id="codexSection"><div class="section-title"><h2>Codex 原图核准</h2><span id="codexBadge"></span></div><div id="codexContent"></div></section>
        <section class="result-section" id="ocrSection"><div class="section-title"><h2>火山 OCR 文字与坐标</h2><span id="ocrCount"></span></div><div id="ocrContent"></div></section>
      </div>
    </section>
  </main>
  <script src="app.js?v=20261110-field-review2" defer></script>
</body>
</html>
